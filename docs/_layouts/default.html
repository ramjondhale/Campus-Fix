<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F5A6A">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- set the saved theme before paint, so there is no flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cf-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">CF</span>
        <span class="brand-text">CampusFix<span class="brand-sub">docs</span></span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="https://campus-fix-a8e09.web.app" target="_blank" rel="noopener">Live demo &#8599;</a>
        <a href="https://github.com/{{ site.repository }}" target="_blank" rel="noopener">GitHub &#8599;</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <span class="theme-toggle-icon" aria-hidden="true">&#9680;</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="content" class="wrap content">
    <article class="doc">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>
        <strong>CampusFix</strong> — a privacy-first college complaint &amp; maintenance app.
        Flutter&nbsp;&middot;&nbsp;Firebase.
      </p>
      <p class="footer-sub">Built with a Claude Opus-orchestrator + Sonnet-agent workflow.</p>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function effective() {
        var t = root.getAttribute('data-theme');
        if (t === 'dark' || t === 'light') return t;
        return mq.matches ? 'dark' : 'light';
      }
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.addEventListener('click', function () {
          var next = effective() === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('cf-theme', next); } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>
